esphome:
  name: esp32-s2-devkit-lipo-usb
  comment: Olimex ESP32-S2-DevKit-LIPO-USB (native USB)

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino

# ---- PSRAM (only for WROVER variant) ----
# Uncomment ONLY if your board uses ESP32-S2 WROVER module
#
# psram:
#   mode: quad
#   speed: 80MHz

logger:

# ================= NETWORKING =================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESP32-S2-USB Fallback"
    password: "fallback123"

captive_portal:

# ================= ONBOARD IO =================

# ---- User Button ----
binary_sensor:
  - platform: gpio
    name: "User Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true

# ---- Power / Battery Sense (disabled by default) ----
# Enable by closing:
#   PWR_SENSE_E1  -> GPIO7 (10k / 1k divider from +5V)
#   BAT_SENS_E1   -> GPIO8 (4.7M / 470k divider from VBAT)

sensor:
  - platform: adc
    pin: GPIO7
    name: "External Power Sense"
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 11.0

  - platform: adc
    pin: GPIO8
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 11.0

# ---- RGB LED (WS2812S) ----
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO18
    num_leds: 1
    name: "RGB LED"

# ---- Optional UART via ESP-PROG header ----
# GPIO44 = RX
# GPIO43 = TX
uart:
  - id: esp_prog_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200

# ================= FREE GPIO =================

switch:
  - platform: gpio
    name: "GPIO1 Output"
    pin: GPIO1

  - platform: gpio
    name: "GPIO2 Output"
    pin: GPIO2

  - platform: gpio
    name: "GPIO3 Output"
    pin: GPIO3

# ================= CORE SERVICES =================

ota:
  - platform: esphome

api: